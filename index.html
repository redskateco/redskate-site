<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Skate Company</title>
  <meta name="description" content="Red Skate Company — coming back soon." />
  <link rel="icon" type="image/png" href="assets/favicon_180x180.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_180x180.png" />
  <style>
    :root {
      --text: #ffffff;
      --muted: rgba(255,255,255,0.78);
      --line: rgba(255,255,255,0.18);
      --overlay: rgba(0,0,0,0.38);
      --overlay-strong: rgba(0,0,0,0.56);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #000;
    }

    body {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background-image:
        linear-gradient(to bottom, var(--overlay-strong), rgba(0,0,0,0.18) 28%, rgba(0,0,0,0.18) 72%, var(--overlay-strong)),
        url('assets/wallpaper.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 34px;
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      z-index: 2;
    }

    .logo {
      width: clamp(110px, 14vw, 180px);
      height: auto;
      display: block;
    }

    .contact-link {
      color: var(--text);
      text-decoration: none;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      background: rgba(0,0,0,0.16);
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .contact-link:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.4);
    }

    .contact-link svg {
      width: 20px;
      height: 20px;
      display: block;
      fill: currentColor;
    }

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
      z-index: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5.5vw, 5.8rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 6px 24px rgba(0,0,0,0.45);
    }

    .footer {
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      justify-content: center;
      text-align: center;
    }

    .footer-left {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .footer-symbols {
      opacity: 0.9;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .page {
        padding: 20px 18px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer {
        flex-direction: column;
        align-items: center;
      }

      .hero {
        justify-content: flex-end;
        padding-bottom: 90px;
      }

      h1 {
        text-align: left;
        letter-spacing: 0.12em;
      }
    }
    .custom-cursor,
    .cursor-trail {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.18s ease, width 0.18s ease, height 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, transform 0.08s linear;
    }

    .custom-cursor.is-visible {
      opacity: 1;
    }

    body.cursor-enabled,
    body.cursor-enabled a,
    body.cursor-enabled button {
      cursor: none;
    }

    .custom-cursor {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff3b57;
      box-shadow: 0 0 0 10px rgba(255,59,87,0.18);
    }

    .custom-cursor.is-hovering {
      width: 18px;
      height: 18px;
      box-shadow: 0 0 0 14px rgba(255,59,87,0.22), 0 0 20px rgba(255,59,87,0.28);
    }

    @media (max-width: 900px), (pointer: coarse) {
      .custom-cursor,
      .cursor-trail {
        display: none !important;
      }

      body.cursor-enabled,
      body.cursor-enabled a,
      body.cursor-enabled button {
        cursor: auto;
      }
    }

      body.cursor-enabled,
      body.cursor-enabled a,
      body.cursor-enabled button {
        cursor: auto;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <img class="logo" src="assets/logo.png" alt="Red Skate logo" />
      <a class="contact-link" href="https://instagram.com/redskatecompany" target="_blank" rel="noopener noreferrer" aria-label="Instagram @redskatecompany" title="Instagram @redskatecompany">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.8A3.95 3.95 0 0 0 3.8 7.75v8.5a3.95 3.95 0 0 0 3.95 3.95h8.5a3.95 3.95 0 0 0 3.95-3.95v-8.5a3.95 3.95 0 0 0-3.95-3.95h-8.5Zm8.95 1.35a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2ZM12 6.85A5.15 5.15 0 1 1 6.85 12 5.16 5.16 0 0 1 12 6.85Zm0 1.8A3.35 3.35 0 1 0 15.35 12 3.35 3.35 0 0 0 12 8.65Z"/>
        </svg>
      </a>
    </header>

    <main class="hero">
      <h1>We’ll be back soon</h1>
    </main>

    <footer class="footer">
      <div class="footer-left">
        <span>Red Skate Company 2026</span>
        <span class="footer-symbols">©</span>
      </div>
    </footer>
  </div>
  <div class="custom-cursor" aria-hidden="true"></div>

  <script>
    (() => {
      const body = document.body;
      const cursor = document.querySelector('.custom-cursor');
      const hoverTargets = document.querySelectorAll('a, button');
      const isDesktop = window.matchMedia('(pointer:fine)').matches && window.innerWidth > 900;

      if (!isDesktop) return;

      body.classList.add('cursor-enabled');

      window.addEventListener('mousemove', (event) => {
        cursor.classList.add('is-visible');
        cursor.style.left = event.clientX + 'px';
        cursor.style.top = event.clientY + 'px';
      });

      window.addEventListener('mousedown', () => {
        cursor.style.transform = 'translate(-50%, -50%) scale(0.9)';
      });

      window.addEventListener('mouseup', () => {
        cursor.style.transform = 'translate(-50%, -50%)';
      });

      document.addEventListener('mouseleave', () => {
        cursor.classList.remove('is-visible');
      });

      hoverTargets.forEach((target) => {
        target.addEventListener('mouseenter', () => {
          cursor.classList.add('is-hovering');
        });
        target.addEventListener('mouseleave', () => {
          cursor.classList.remove('is-hovering');
        });
      });
    })();
  </script>
</body>
</html>
